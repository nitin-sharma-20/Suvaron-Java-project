<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | Suvaron</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .error { color: #ff8a96; font-size: 0.85rem; margin-top: 0.25rem; }
    </style>
</head>
<body id="page-top">

<!-- Navigation-->
<div th:replace="~{fragments/navbar :: navbar('no', 'yes', 'yes', 'no', 'no', 'no')}"></div>

<section class="auth-wrapper py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                <div class="auth-card">
                    <div class="text-center mb-5">
                        <h2 class="fw-bold mb-2">Create Account</h2>
                        <p class="text-muted">Join Suvaron and take control of your finances</p>
                    </div>

                    <div th:if="${param.userFound}" class="alert alert-danger" style="background: rgba(220, 53, 69, 0.1); border-color: var(--bs-danger); color: #ff8a96;">
                        A user with this username already exists.
                    </div>

                    <form th:action="@{/processRegistration}" th:object="${webUser}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label for="firstname" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstname" placeholder="John" th:field="*{firstName}" required>
                                <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastname" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastname" placeholder="Doe" th:field="*{lastName}" required>
                                <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error"></div>
                            </div>
                            <div class="col-12 mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="john@example.com" th:field="*{email}" required>
                                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
                            </div>
                            <div class="col-12 mb-3">
                                <label for="userName" class="form-label">Username</label>
                                <input type="text" class="form-control" id="userName" placeholder="Choose a username" th:field="*{username}" required>
                                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></div>
                            </div>
                            <div class="col-12 mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Create a strong password" th:field="*{password}" required>
                                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
                            </div>
                            <div class="col-12 d-grid mb-4">
                                <button class="btn btn-primary btn-lg" type="submit">Sign Up</button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="text-muted mb-0">Already have an account? <a th:href="@{/showLoginPage}" class="fw-bold text-decoration-none" style="color: var(--accent-color);">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
