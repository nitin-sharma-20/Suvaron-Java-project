<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Suvaron</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body id="page-top">

<!-- Navigation-->
<div th:replace="~{fragments/navbar :: navbar('no', 'yes', 'yes', 'no', 'no', 'no')}"></div>

<section class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="auth-card">
                    <div class="text-center mb-5">
                        <h2 class="fw-bold mb-2">Welcome Back</h2>
                        <p class="text-muted">Sign in to continue to Suvaron</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger" style="background: rgba(220, 53, 69, 0.1); border-color: var(--bs-danger); color: #ff8a96;">
                        Invalid username or password
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" style="background: rgba(25, 135, 84, 0.1); border-color: var(--bs-success); color: #84d6a4;">
                        You have been logged out
                    </div>
                    <div th:if="${param.registrationSuccess}" class="alert alert-success" style="background: rgba(25, 135, 84, 0.1); border-color: var(--bs-success); color: #84d6a4;">
                        Account created successfully! Please sign in.
                    </div>

                    <form th:action="@{/authenticateTheUser}" method="post">
                        <div class="mb-4">
                            <label for="userName" class="form-label">Username</label>
                            <input type="text" class="form-control form-control-lg" name="username" id="userName" placeholder="Enter your username" required>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label">Password</label>
                                <a href="#!" class="text-decoration-none" style="color: var(--accent-color); font-size: 0.9rem;">Forgot password?</a>
                            </div>
                            <input type="password" class="form-control form-control-lg" name="password" id="password" placeholder="Enter your password" required>
                        </div>
                        <div class="mb-4 form-check">
                            <input class="form-check-input" type="checkbox" name="remember_me" id="remember_me" style="background-color: var(--card-dark); border-color: var(--border-color);">
                            <label class="form-check-label text-muted" for="remember_me">
                                Remember me
                            </label>
                        </div>
                        <div class="d-grid mb-4">
                            <button class="btn btn-primary btn-lg" type="submit">Sign In</button>
                        </div>
                    </form>
                    
                    <div class="text-center">
                        <p class="text-muted mb-0">Don't have an account? <a th:href="@{/showRegistrationForm}" class="fw-bold text-decoration-none" style="color: var(--accent-color);">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
