<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Add Expense | Suvaron</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body id="page-top">
<!-- Navigation-->
<div th:replace="~{fragments/navbar :: navbar('no', 'no', 'no', 'yes', 'yes', 'yes')}"></div>

<section class="container pb-5" style="min-height: calc(100vh - 80px);">
    <div class="d-flex align-items-center gap-3 page-title">
        <a th:href="@{/list}" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="mb-0">Record New Expense</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="filter-section p-4 p-md-5">
                <form th:action="@{/submitAdd}" th:object="${expense}" method="post">
                    <div class="mb-4">
                        <label for="expenseCategory" class="form-label fw-bold">Category</label>
                        <select id="expenseCategory" name="expenseCategory" class="form-select form-select-lg" th:field="*{category}">
                            <option value="groceries">Groceries</option>
                            <option value="Utilities(bills)">Utilities (bills)</option>
                            <option value="transportation">Transportation</option>
                            <option value="dining out">Dining Out</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="shopping">Shopping</option>
                            <option value="travel">Travel</option>
                            <option value="education">Education</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label for="amount" class="form-label fw-bold">Amount (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-light">₹</span>
                            <input type="number" class="form-control form-control-lg border-start-0" id="amount" th:field="*{amount}" placeholder="0.00" step="0.01" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="dateTime" class="form-label fw-bold">Date & Time</label>
                        <input type="datetime-local" class="form-control form-control-lg" id="dateTime" th:field="*{dateTime}" required>
                    </div>
                    
                    <div class="mb-5">
                        <label for="description" class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="What was this expense for?"></textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Save Expense</button>
                        <a th:href="@{/list}" class="btn btn-outline-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
