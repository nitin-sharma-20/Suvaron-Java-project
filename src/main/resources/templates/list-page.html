<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Dashboard | Suvaron</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body id="page-top">
<!-- Navigation-->
<div th:replace="~{fragments/navbar :: navbar('no', 'no', 'no', 'yes', 'yes', 'yes')}"></div>

<section class="container pb-5" style="min-height: calc(100vh - 80px);">
    <div class="d-flex justify-content-between align-items-center page-title">
        <h2 class="mb-0">Your Dashboard</h2>
        <div>
            <button class="btn btn-outline-light me-2" type="button" data-bs-toggle="collapse" data-bs-target="#filterCollapse" aria-expanded="false" aria-controls="filterCollapse">
                <i class="fa-solid fa-filter me-2"></i> Filters
            </button>
            <a th:href="@{/showAdd}" class="btn btn-primary">
                <i class="fa-solid fa-plus me-2"></i> Add Expense
            </a>
        </div>
    </div>

    <!-- Filter form-->
    <div class="collapse mb-4" id="filterCollapse">
        <div class="filter-section">
            <form th:action="@{/processFilter}" th:object="${filter}" method="post">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="expenseCategory" class="form-label">Category</label>
                        <select id="expenseCategory" name="expenseCategory" class="form-select" th:field="*{category}">
                            <option value="all">All Categories</option>
                            <option value="groceries">Groceries</option>
                            <option value="Utilities(bills)">Utilities (bills)</option>
                            <option value="transportation">Transportation</option>
                            <option value="dining out">Dining Out</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="shopping">Shopping</option>
                            <option value="travel">Travel</option>
                            <option value="education">Education</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label d-block">Amount Range (₹)</label>
                        <div class="d-flex gap-2 align-items-center">
                            <input type="number" class="form-control" id="from" placeholder="Min" th:field="*{from}">
                            <span class="text-muted">-</span>
                            <input type="number" class="form-control" id="to" placeholder="Max" th:field="*{to}">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label d-block">Date</label>
                        <div class="d-flex gap-2 align-items-center">
                            <select id="months" name="months" class="form-select" th:field="*{month}">
                                <option value="all">All Months</option>
                                <option value="01">Jan</option>
                                <option value="02">Feb</option>
                                <option value="03">Mar</option>
                                <option value="04">Apr</option>
                                <option value="05">May</option>
                                <option value="06">Jun</option>
                                <option value="07">Jul</option>
                                <option value="08">Aug</option>
                                <option value="09">Sep</option>
                                <option value="10">Oct</option>
                                <option value="11">Nov</option>
                                <option value="12">Dec</option>
                            </select>
                            <select id="years" name="years" class="form-select" th:field="*{year}">
                                <option value="all">All Years</option>
                                <option value="2022">2022</option>
                                <option value="2023">2023</option>
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026">2026</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Apply Filter</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(expenseList)}" class="text-center py-5 auth-card mt-4">
        <i class="fa-solid fa-receipt fs-1 mb-3 text-muted"></i>
        <h4 class="fw-bold">No Expenses Found</h4>
        <p class="text-muted mb-4">You haven't recorded any expenses yet, or none match your filters.</p>
        <a th:href="@{/showAdd}" class="btn btn-primary">Add Your First Expense</a>
    </div>

    <!-- Expenses Grid -->
    <div class="row g-4" th:if="${not #lists.isEmpty(expenseList)}">
        <div class="col-12 col-md-6 col-lg-4" th:each="exp, iterStat : ${expenseList}">
            <!-- Alternating card colors based on index -->
            <div class="expense-card" th:classappend="${iterStat.index % 3 == 0 ? 'green-accent' : (iterStat.index % 3 == 1 ? 'orange-accent' : '')}">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge bg-dark bg-opacity-25 px-3 py-2 rounded-pill text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px;" th:text="${exp.categoryName}"></span>
                    <div class="text-end" style="font-size: 0.85rem; opacity: 0.8;">
                        <div th:text="${exp.date}"></div>
                        <div th:text="${exp.time}"></div>
                    </div>
                </div>
                
                <div class="expense-amount mb-3">₹ <span th:text="${exp.amount}"></span></div>
                
                <p class="mb-4" style="font-size: 0.95rem; opacity: 0.9; min-height: 45px;" th:text="${exp.description ?: 'No description provided'}"></p>
                
                <div class="d-flex gap-2 border-top pt-3 mt-auto" style="border-color: rgba(0,0,0,0.1) !important;">
                    <a th:href="@{/showUpdate(expId=${exp.id})}" class="btn btn-sm btn-dark bg-opacity-75 flex-grow-1 border-0">Update</a>
                    <a th:href="@{/delete(expId=${exp.id})}" class="btn btn-sm btn-outline-dark flex-grow-1 border-0" style="background: rgba(0,0,0,0.1);" onclick="return confirm('Are you sure you want to delete this expense?')">Delete</a>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
