<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Filtered Results | Suvaron</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body id="page-top">
<!-- Navigation-->
<div th:replace="~{fragments/navbar :: navbar('no', 'no', 'no', 'yes', 'yes', 'yes')}"></div>

<section class="container pb-5" style="min-height: calc(100vh - 80px);">
    <div class="d-flex justify-content-between align-items-center page-title">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/list}" class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="mb-0">Search Results</h2>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(expenseList)}" class="text-center py-5 auth-card mt-4">
        <i class="fa-solid fa-magnifying-glass fs-1 mb-3 text-muted"></i>
        <h4 class="fw-bold">No Matches Found</h4>
        <p class="text-muted mb-4">We couldn't find any expenses matching your filter criteria.</p>
        <a th:href="@{/list}" class="btn btn-primary">Back to All Expenses</a>
    </div>

    <!-- Expenses Grid -->
    <div class="row g-4" th:if="${not #lists.isEmpty(expenseList)}">
        <div class="col-12 col-md-6 col-lg-4" th:each="exp, iterStat : ${expenseList}">
            <div class="expense-card" th:classappend="${iterStat.index % 3 == 0 ? 'green-accent' : (iterStat.index % 3 == 1 ? 'orange-accent' : '')}">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge bg-dark bg-opacity-25 px-3 py-2 rounded-pill text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px;" th:text="${exp.categoryName}"></span>
                    <div class="text-end" style="font-size: 0.85rem; opacity: 0.8;">
                        <div th:text="${exp.date}"></div>
                        <div th:text="${exp.time}"></div>
                    </div>
                </div>
                
                <div class="expense-amount mb-3">₹ <span th:text="${exp.amount}"></span></div>
                
                <p class="mb-4" style="font-size: 0.95rem; opacity: 0.9; min-height: 45px;" th:text="${exp.description ?: 'No description provided'}"></p>
                
                <div class="d-flex gap-2 border-top pt-3 mt-auto" style="border-color: rgba(0,0,0,0.1) !important;">
                    <a th:href="@{/showUpdate(expId=${exp.id})}" class="btn btn-sm btn-dark bg-opacity-75 flex-grow-1 border-0">Update</a>
                    <a th:href="@{/delete(expId=${exp.id})}" class="btn btn-sm btn-outline-dark flex-grow-1 border-0" style="background: rgba(0,0,0,0.1);" onclick="return confirm('Are you sure you want to delete this expense?')">Delete</a>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
